<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#262626" stroke-width="4"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Scooter / Bike Minimalist Silhouette -->
  <g transform="translate(106, 120) scale(1.18)" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Back Wheel -->
    <circle cx="45" cy="175" r="32" fill="#141416" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="45" cy="175" r="10" fill="url(#gold)"/>
    
    <!-- Front Wheel -->
    <circle cx="210" cy="175" r="32" fill="#141416" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="210" cy="175" r="10" fill="url(#gold)"/>

    <!-- Chassis Body -->
    <path d="M 45 175 L 85 175 L 115 155 L 155 155 L 185 85 L 165 85" />
    <path d="M 85 175 L 100 120 L 150 120 L 175 160 L 210 175" />
    
    <!-- Handlebar & Headlight -->
    <path d="M 175 85 L 195 80" />
    <path d="M 185 85 L 180 60 L 160 60" />
    
    <!-- Seat -->
    <path d="M 85 115 Q 120 110 145 118" stroke-width="16" stroke="#FFFFFF" />
  </g>

  <!-- Partner Portal Tag Badge -->
  <rect x="136" y="385" width="240" height="46" rx="23" fill="#1F1F23" stroke="url(#gold)" stroke-width="2"/>
  <text x="256" y="415" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="3">VENDOR APP</text>
</svg>
